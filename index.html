<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spartito</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f5d62">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Spartito">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#f6f3ec;--paper:#fffdf8;--ink:#1d1b18;--mute:#6f6a60;--line:#d8d2c4;--acc:#2f5d62;--hl:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17191a;--paper:#202324;--ink:#eee9dd;--mute:#9a958a;--line:#3a3e40;--acc:#7fb5ba;--hl:#ff7a66}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;padding:12px;max-width:1000px;margin:0 auto}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;align-items:center}
.bar .l{font-size:12px;color:var(--mute);width:66px}
button,select{font:inherit;font-size:15px;min-width:42px;height:40px;padding:0 10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px}
button.on{background:var(--acc);color:var(--paper);border-color:var(--acc)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:6px;margin:12px 0;padding:10px 6px 4px}
.sheet input{display:block;width:100%;border:0;border-bottom:1px dashed transparent;background:transparent;color:var(--ink);font-family:inherit;outline:0}
.sheet input:hover,.sheet input:focus{border-bottom-color:var(--line)}
#ti{text-align:center;font-size:26px;font-weight:600}
#co{text-align:right;font-size:15px;font-style:italic;color:var(--mute);padding:2px 8px 0}
#tm{font-size:16px;font-style:italic;font-weight:600;padding:2px 8px 4px}
svg{display:block;width:100%;height:auto;touch-action:manipulation;cursor:crosshair}
#sv{min-width:720px}
.sc{overflow-x:auto}
svg .l{stroke:var(--ink);stroke-width:1}
svg .n{fill:var(--ink)}
svg .o{fill:var(--paper);stroke:var(--ink);stroke-width:1.5}
svg .s{stroke:var(--ink);stroke-width:1.2;fill:none}
svg .cur{fill:var(--hl);stroke:var(--hl)}
svg text{fill:var(--ink)}
#tp{display:none;margin:8px 0;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
#tp input{width:100%;height:40px;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:var(--bg);color:var(--ink);margin-bottom:6px}
#chips button{min-width:0;height:32px;font-size:13px;padding:0 8px}
#msg{min-height:20px;font-size:14px;color:var(--hl)}
input[type=range]{width:130px;accent-color:var(--acc)}
</style>
</head>
<body>
<div class="bar"><span class="l">Tempo</span>
<select id="ts" aria-label="Tempo in battuta"><option>2/4</option><option>3/4</option><option selected>4/4</option><option>5/4</option><option>6/8</option><option>9/8</option><option>12/8</option><option>2/2</option><option>3/8</option></select>
<select id="mk" aria-label="Indicazione di movimento"></select></div>
<div class="bar" id="durs"><span class="l">Durata</span></div>
<div class="bar" id="modes"><span class="l">Inserisci</span></div>
<div class="bar" id="accs"><span class="l">Alterazione</span></div>
<div class="bar" id="opts"><span class="l">Crome</span></div>
<div class="bar" id="dots"><span class="l">Punto</span></div>
<div class="bar" id="trs"><span class="l">Gruppo</span></div>
<div class="bar"><span class="l">Armatura</span><select id="ks" aria-label="Armatura di chiave"><option value="0">Do magg. / La min. (nessuna)</option><option value="1">Sol (1 ♯)</option><option value="2">Re (2 ♯)</option><option value="3">La (3 ♯)</option><option value="4">Mi (4 ♯)</option><option value="5">Si (5 ♯)</option><option value="6">Fa♯ (6 ♯)</option><option value="7">Do♯ (7 ♯)</option><option value="-1">Fa (1 ♭)</option><option value="-2">Si♭ (2 ♭)</option><option value="-3">Mi♭ (3 ♭)</option><option value="-4">La♭ (4 ♭)</option><option value="-5">Re♭ (5 ♭)</option><option value="-6">Sol♭ (6 ♭)</option><option value="-7">Do♭ (7 ♭)</option></select></div>
<div class="bar" id="signs"><span class="l">Segno</span><select id="sg" aria-label="Segno di ripetizione"><option value="rs">Ritornello: inizio |:</option><option value="re">Ritornello: fine :|</option><option value="v1">Casa 1</option><option value="v2">Casa 2</option><option value="dc">D.C.</option><option value="ds">D.S.</option><option value="fine">Fine</option><option value="segno">Segno §</option><option value="coda">Coda ⊕</option><option value="tocoda">To Coda</option><option value="clr">Cancella segni</option></select></div>
<div class="sheet">
<input id="ti" placeholder="Titolo" aria-label="Titolo">
<input id="co" placeholder="Compositore" aria-label="Compositore">
<div id="tm"></div>
<div class="sc"><svg id="sv" viewBox="0 0 908 460" role="img" aria-label="Spartito per pianoforte"></svg></div></div>
<div id="msg" aria-live="polite"></div>
<div id="tp"><input id="tt" maxlength="60" placeholder="Testo o dinamica (es. dolce, rit., p, mf, cresc.)" aria-label="Testo"><div class="bar" id="chips"></div><div class="bar"><button id="tok" class="on">OK</button><button id="tdel">Elimina</button><button id="tcan">Annulla</button></div></div>
<div class="bar"><button id="play">▶ Ascolta</button><button id="add">+ Battuta</button><button id="del">− Battuta</button><button id="clr">Svuota</button><button id="sf">Salva file</button><button id="op">Apri file</button><input type="file" id="fl" accept=".json,application/json" hidden><button id="pdf">⬇ Salva PDF</button></div>
<div class="bar"><span class="l">Velocità</span><input type="range" id="bpm" min="40" max="200" value="112" aria-label="Velocità"><span id="bv" style="font-size:14px">♩ = 112</span></div>
<script>
var DUR={1:4,2:2,4:1,8:0.5,16:0.25};function dur(e){return DUR[e.d]*(e.dot?1.5:1)*(e.tr?2/3:1)}
var MARK=[["Largo",50],["Adagio",66],["Andante",80],["Moderato",100],["Allegretto",112],["Allegro",132],["Vivace",156],["Presto",176]];
var uid=0;var st={tx:[],tr:0,dot:0,beam:1,m:[],d:4,mode:"note",acc:0,cur:null,n:4,q:4};
var MPR=6,RH=230,CW=68,W=908,MW=(W-CW)/MPR,KS=0,SP=5,SEMI=[0,2,4,5,7,9,11];
var sv=document.getElementById("sv"),msg=document.getElementById("msg");
function newM(){return{t:[],b:[]}}
for(var i=0;i<MPR*2;i++)st.m.push(newM());
function cap(){return st.n*4/st.q}
function used(a){return a.reduce(function(s,e){return s+dur(e)},0)}
function tt(r){return r*RH+66}
function bt(r){return tt(r)+90}
function mk(id,items,key){
  var box=document.getElementById(id);
  items.forEach(function(it){
    var b=document.createElement("button");b.textContent=it[0];b.dataset.v=it[1];b.dataset.k=key;
    b.onclick=function(){st[key]=isNaN(it[1])?it[1]:Number(it[1]);sync()};
    box.appendChild(b);
  });
}
mk("durs",[["𝅝 1",1],["𝅗𝅥 1/2",2],["♩ 1/4",4],["♪ 1/8",8]],"d");
mk("durs",[["♬ 1/16",16]],"d");
mk("modes",[["Nota","note"],["Pausa","rest"],["Legatura","tie"],["Leg. lunga","slur"],["Accordo","chord"],["Segni","mark"],["Testo","text"],["Gomma","erase"]],"mode");
mk("accs",[["♮",0],["♯",1],["♭",-1]],"acc");
mk("opts",[["Unite a travi",1],["Con codina",0]],"beam");
mk("trs",[["Normale",0],["Terzina",1]],"tr");
mk("accs",[["Bequadro",2]],"acc");
mk("dots",[["Senza punto",0],["Puntata ·",1]],"dot");
function sync(){if(st.mode!=="text"&&tEdit)closeTx();if(st.mode!=="slur"&&st.pend){st.pend=null;st.cur=null;draw()}document.querySelectorAll(".bar button[data-k]").forEach(function(b){b.classList.toggle("on",String(st[b.dataset.k])===b.dataset.v)})}
var mkSel=document.getElementById("mk");
MARK.forEach(function(x,i){var o=document.createElement("option");o.value=i;o.textContent=x[0];if(x[0]==="Allegretto")o.selected=true;mkSel.appendChild(o)});
function tmText(){
  var b=document.getElementById("bpm").value;
  document.getElementById("tm").textContent=MARK[mkSel.value][0]+"  ♩ = "+b;
  document.getElementById("bv").textContent="♩ = "+b;
}
mkSel.onchange=function(){document.getElementById("bpm").value=MARK[mkSel.value][1];tmText()};
document.getElementById("bpm").oninput=tmText;
document.getElementById("ts").onchange=function(){
  var p=this.value.split("/");st.n=+p[0];st.q=+p[1];var cut=false;
  st.m.forEach(function(m){["t","b"].forEach(function(k){while(used(m[k])>cap()){m[k].pop();cut=true}})});
  msg.textContent=cut?"Alcune note non entravano nella nuova battuta e sono state rimosse.":"";
  draw();
};
function exs(a,mi){
  var x0=CW+(mi%MPR)*MW+14,pos=0,c=cap();
  return a.map(function(e){var x=x0+(pos/c)*(MW-34)+8;pos+=dur(e);return x});
}
function midi(e,k){var d=e.s+(k==="t"?2:-10);var o=4+Math.floor(d/7);var n=((d%7)+7)%7;return 12*(o+1)+SEMI[n]+(e.a===2?0:(e.a?e.a:kalt(n)))}
function body(r0,r1){
  var o="";
  for(var r=r0;r<r1;r++){
    var t=tt(r),b=bt(r),mid=(t+b+40)/2;
    [t,b].forEach(function(y){for(var i=0;i<5;i++)o+='<line class="l" x1="12" x2="'+(W-2)+'" y1="'+(y+i*10)+'" y2="'+(y+i*10)+'"/>'});
    o+='<line class="l" x1="12" x2="12" y1="'+t+'" y2="'+(b+40)+'"/>';
    o+='<path class="s" stroke-width="2" d="M11 '+t+' C2 '+(t+30)+' 2 '+(mid-12)+' 4 '+mid+' C2 '+(mid+12)+' 2 '+(b+10)+' 11 '+(b+40)+'"/>';
    o+='<text x="16" y="'+(t+38)+'" font-size="52" font-family="serif">𝄞</text>';
    o+='<text x="16" y="'+(b+30)+'" font-size="46" font-family="serif">𝄢</text>';
    o+=keySvg(t,b);
    if(r===0)[t,b].forEach(function(y){o+='<text x="'+(50+7*Math.abs(KS))+'" y="'+(y+18)+'" font-size="23" font-weight="700" font-family="serif" text-anchor="middle">'+st.n+'</text><text x="'+(50+7*Math.abs(KS))+'" y="'+(y+38)+'" font-size="23" font-weight="700" font-family="serif" text-anchor="middle">'+st.q+'</text>'});
  }
  st.m.forEach(function(m,mi){
    var r=Math.floor(mi/MPR),t=tt(r),b=bt(r),end=CW+(mi%MPR+1)*MW;
    if(r<r0||r>=r1)return;
    o+='<line class="l" x1="'+end+'" x2="'+end+'" y1="'+t+'" y2="'+(b+40)+'"/>';
    o+=signsSvg(m,mi,t,b,end);
    [["t",t],["b",b]].forEach(function(p){
      var k=p[0],top=p[1],by=top+40,xs=exs(m[k],mi),bm=beams(m[k]);
      m[k].forEach(function(e,i){
        var x=xs[i],c=(st.cur===e)?" cur":"";
        if(e.rest){o+=rest(e,x,top,c);if(e.d===16)o+='<circle class="n" cx="'+(x-4)+'" cy="'+(top+25)+'" r="2.5"/>';if(e.dot)o+='<circle class="n" cx="'+(x+9)+'" cy="'+(top+17)+'" r="1.7"/>';return}
        var y=by-e.s*SP;o+=noteSvg(e,x,by,c,!!bm[i]);
        if(e.l)o+=tieSvg(e,k,mi,i,x,y);
        if(e.sl)o+=slurSvg(e,k);
      });
      o+=beamSvg(m[k],bm,xs,by);
      o+=tripSvg(m[k],bm,xs,by);
    });
  });
  st.tx.forEach(function(n){
    var r=Math.floor(n.y/RH);if(r<r0||r>=r1)return;
    var dyn=/^(p{1,3}|mp|mf|f{1,3}|sf|sfz|fp)$/.test(n.t);
    o+='<text x="'+n.x+'" y="'+n.y+'" font-size="'+(dyn?15:12)+'" font-style="italic" font-weight="'+(dyn?700:400)+'" font-family="Georgia,serif">'+esc(n.t)+'</text>';
  });
  return o;
}
function draw(){var rows=Math.ceil(st.m.length/MPR);sv.setAttribute("viewBox","0 0 "+W+" "+(rows*RH));sv.innerHTML=body(0,rows)}
function rest(e,x,t,c){
  if(e.d===1)return '<rect class="n'+c+'" x="'+(x-6)+'" y="'+(t+10)+'" width="12" height="5"/>';
  if(e.d===2)return '<rect class="n'+c+'" x="'+(x-6)+'" y="'+(t+15)+'" width="12" height="5"/>';
  if(e.d===4)return '<path class="s'+c+'" stroke-width="2.2" d="M'+(x-3)+' '+(t+8)+' l6 8 l-6 8 l6 8"/>';
  return '<circle class="n'+c+'" cx="'+(x-2)+'" cy="'+(t+17)+'" r="2.5"/><path class="s'+c+'" d="M'+(x+4)+' '+(t+14)+' l-6 18"/>';
}
sv.addEventListener("click",function(ev){
  var r=sv.getBoundingClientRect(),k=W/r.width;
  var x=(ev.clientX-r.left)*k,y=(ev.clientY-r.top)*k;
  msg.textContent="";
  if(st.mode==="text"){
    var hit=-1,hd=24;
    st.tx.forEach(function(n,i){var w=n.t.length*3.4+8,dxx=x<n.x?n.x-x:(x>n.x+w?x-n.x-w:0),d=Math.sqrt(dxx*dxx+Math.pow(y-(n.y-4),2));if(d<hd){hd=d;hit=i}});
    openTx(hit,x,y);return;
  }
  var row=Math.floor(y/RH),col=x<CW?-1:Math.min(MPR-1,Math.floor((x-CW)/MW));
  if(col<0)return;
  var mi=row*MPR+col;if(mi>=st.m.length)return;
  if(st.mode==="mark"){
    var mm=st.m[mi],sgv=document.getElementById("sg").value;
    if(sgv==="rs")mm.rs=!mm.rs;
    else if(sgv==="re")mm.re=!mm.re;
    else if(sgv==="v1")mm.v=mm.v===1?0:1;
    else if(sgv==="v2")mm.v=mm.v===2?0:2;
    else if(sgv==="clr"){mm.rs=false;mm.re=false;mm.v=0;mm.mk=""}
    else mm.mk=mm.mk===sgv?"":sgv;
    draw();return;
  }
  var stf=(y-row*RH)<131?"t":"b",top=stf==="t"?tt(row):bt(row);
  var a=st.m[mi][stf],xs=exs(a,mi);
  if(st.mode==="tie"){
    var bi=-1,bdd=18;
    xs.forEach(function(px,i){var d=Math.abs(px-x);if(d<bdd&&!a[i].rest){bdd=d;bi=i}});
    if(bi<0){msg.textContent="Tocca una nota per legarla alla successiva; tocca di nuovo per togliere la legatura.";return}
    if(a[bi].l){a[bi].l=false;draw();return}
    var nx=nextOf(stf,mi,bi);
    if(!nx||nx.e.rest){msg.textContent="Dopo questa nota non c’è un’altra nota a cui legarla.";return}
    a[bi].l=true;draw();return;
  }
  if(st.mode==="chord"){
    var ci=-1,cd=20;
    xs.forEach(function(px,i){var d=Math.abs(px-x);if(d<cd&&!a[i].rest){cd=d;ci=i}});
    if(ci<0){msg.textContent="Tocca vicino a una nota per aggiungere sopra o sotto un\u2019altra nota (accordo).";return}
    var q={s:Math.max(-6,Math.min(14,Math.round((top+40-y)/SP))),a:st.acc},P=heads(a[ci]);
    if(P.some(function(h){return h.s===q.s})){msg.textContent="C\u2019\u00e8 gi\u00e0 una nota a questa altezza.";return}
    P.push(q);P.sort(function(p1,p2){return p1.s-p2.s});setHeads(a[ci],P);tone(midi(q,stf),0.35);draw();return;
  }
  if(st.mode==="slur"){
    var si=-1,sd=18;
    xs.forEach(function(px,i){var d=Math.abs(px-x);if(d<sd&&!a[i].rest){sd=d;si=i}});
    if(si<0){msg.textContent="Tocca la prima nota, poi l’ultima nota della legatura.";return}
    var ev=a[si];
    if(st.pend){
      if(st.pend.k!==stf||st.pend.e===ev){st.pend=null;st.cur=null;draw();msg.textContent="Legatura annullata. Tocca la prima nota per ricominciare.";return}
      var L=flatK(stf),ia=-1,ib=-1;
      L.forEach(function(p,j){if(p.e===st.pend.e)ia=j;if(p.e===ev)ib=j});
      if(ia<0||ib<=ia){msg.textContent="Come ultima nota tocca una nota che viene dopo la prima, nello stesso rigo.";return}
      if(!ev.id)ev.id=++uid;
      st.pend.e.sl=ev.id;st.pend=null;st.cur=null;draw();return;
    }
    if(ev.sl){ev.sl=0;draw();return}
    st.pend={k:stf,e:ev};st.cur=ev;draw();msg.textContent="Ora tocca l’ultima nota della legatura.";return;
  }
  if(st.mode==="erase"){
    var best=-1,bd=18;
    xs.forEach(function(px,i){var d=Math.abs(px-x);if(d<bd){bd=d;best=i}});
    if(best>=0){if(!a[best].rest&&heads(a[best]).length>1){var P2=heads(a[best]),ky=top+40-y,bj=0,bdv=1e9;P2.forEach(function(h,j){var dd=Math.abs(h.s*SP-ky);if(dd<bdv){bdv=dd;bj=j}});P2.splice(bj,1);setHeads(a[best],P2)}else a.splice(best,1)}
    draw();return;
  }
  if(used(a)+dur({d:st.d,dot:st.dot,tr:st.tr})>cap()+1e-6){msg.textContent="Battuta piena in questo rigo: scegli una durata più breve o cancella una nota.";return}
  var idx=0;xs.forEach(function(px){if(px<x)idx++});
  var e={d:st.d};if(st.dot)e.dot=1;if(st.tr)e.tr=1;
  if(st.mode==="rest")e.rest=true;
  else{
    e.s=Math.max(-6,Math.min(14,Math.round((top+40-y)/SP)));e.a=st.acc;
    tone(midi(e,stf),0.35);
  }
  a.splice(idx,0,e);draw();
});
var ac=null;
function tone(mn,len,when){
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    var t=(when||ac.currentTime),o=ac.createOscillator(),g=ac.createGain();
    o.type="triangle";o.frequency.value=440*Math.pow(2,(mn-69)/12);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.2,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+len);
    o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+len+0.05);
  }catch(e){}
}
var timers=[],playBtn=document.getElementById("play");
function stop(){timers.forEach(clearTimeout);timers=[];st.cur=null;draw();playBtn.textContent="▶ Ascolta"}
playBtn.onclick=function(){
  if(timers.length){stop();return}
  var spb=60/Number(document.getElementById("bpm").value),mt=cap()*spb,end=0;
  playBtn.textContent="■ Stop";tieInfo();
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){}
  playOrder().forEach(function(mi,pi){var m=st.m[mi];
    ["t","b"].forEach(function(k){
      var t=pi*mt;
      m[k].forEach(function(e){
        var len=dur(e)*spb,at=t;
        if(!e.rest&&!e.skip)heads(e).forEach(function(h){tone(midi(h,k),Math.max(0.15,(len+(e.ext||0)*spb)*0.95),ac.currentTime+at+0.05)});
        timers.push(setTimeout(function(){st.cur=e;draw()},at*1000));
        t+=len;
      });
    });
    end=(pi+1)*mt;
  });
  timers.push(setTimeout(stop,end*1000+100));
};
function beams(a){
  var map={};if(!st.beam)return map;
  var g=(st.q===8&&st.n%3===0)?1.5:1,pos=0,cur=null,all=[];
  a.forEach(function(e,i){
    var ok=(e.d===8||e.d===16)&&!e.rest,grp=Math.floor(pos/g+1e-9);
    if(ok&&cur&&cur.grp===grp&&cur.last===i-1){cur.idx.push(i);cur.last=i}
    else{cur=ok?{grp:grp,idx:[i],last:i}:null;if(cur)all.push(cur)}
    pos+=dur(e);
  });
  all.forEach(function(c){
    if(c.idx.length<2)return;
    var sum=0;c.idx.forEach(function(i){var r=rng(a[i]);sum+=(r[0]+r[1])/2});
    c.up=sum/c.idx.length<4;
    c.idx.forEach(function(i){map[i]=c});
  });
  return map;
}
function signsSvg(m,mi,t,b,end){

    for(var p=0;p<pages;p++){
      var r0=p*per,r1=Math.min(rows,r0+per),hd=p===0?86:0,h=hd+(r1-r0)*RH;
      var s='<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+h+'" viewBox="0 0 '+W+' '+h+'"><style>'+css+'</style><rect width="'+W+'" height="'+h+'" fill="#fff"/>';
      if(p===0)s+='<text x="'+(W/2)+'" y="34" font-size="26" font-weight="700" font-family="Georgia,serif" text-anchor="middle">'+esc(title)+'</text><text x="'+(W-8)+'" y="56" font-size="14" font-style="italic" font-family="Georgia,serif" text-anchor="end">'+esc(comp)+'</text><text x="10" y="76" font-size="15" font-style="italic" font-weight="700" font-family="Georgia,serif">'+esc(tmx)+'</text>';
      s+='<g transform="translate(0,'+(hd-r0*RH)+')">'+body(r0,r1)+'</g></svg>';
      var png=await toPng(s,W,h);
      if(p>0)pdf.addPage();
      pdf.addImage(png,"PNG",20,15,170,h*170/W);
    }
    var name=title.replace(/[^\w\u00C0-\u017F]+/g,"_").replace(/^_+|_+$/g,"")||"spartito";
    await dl.save({filename:name+".pdf",data:pdf.output("arraybuffer")});
    msg.textContent="";
  }catch(e){
    msg.textContent=(e&&e.code==="declined")?"Salvataggio annullato.":"Non sono riuscito a creare il PDF.";
  }
};
sync();tmText();draw();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
</script>
